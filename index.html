<html lang="en">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var activeFetch = originalFetch ? originalFetch.bind(window) : undefined;

          Object.defineProperty(window, 'fetch', {
            get: function() {
              return activeFetch;
            },
            set: function(fn) {
              activeFetch = fn;
            },
            configurable: true,
            enumerable: true
          });

          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              var protoDesc = Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
              if (protoDesc && !protoDesc.set) {
                Object.defineProperty(Window.prototype, 'fetch', {
                  get: function() {
                    return activeFetch;
                  },
                  set: function(fn) {
                    activeFetch = fn;
                  },
                  configurable: true,
                  enumerable: true
                });
              }
            } catch (e1) {}
          }
        } catch (e) {}

        window.addEventListener('error', function(event) {
          if (
            (event.filename && (event.filename.indexOf('chrome-extension://') !== -1 || event.filename.indexOf('moz-extension://') !== -1)) ||
            (event.message && (event.message.indexOf('fetch of #<Window>') !== -1 || event.message.indexOf('Cannot set property fetch') !== -1))
          ) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
            return true;
          }
        }, true);
      })();
    </script>
