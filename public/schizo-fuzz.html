    // ========================================================
    // 1. DOKIDOKI WEB3 PLATFORM BRIDGE
    // ========================================================
    class DokidokiWeb3Bridge {
      constructor() {
        this.userData = { username: 'DokiPilot', address: '0x000...000' };
        window.addEventListener('message', this.handleIncomingMessage.bind(this));
      }
      notify(msg) {
        console.log('[Web3Bridge]', msg);
        const toast = document.getElementById('bridge-toast');
        if (toast) toast.innerText = `● Bridge: ${msg}`;
      }
      requestUserData(cb) {
        this.onUser = cb;
        window.postMessage({ type: 'WEB3_REQUEST_USER_DATA' }, '*');
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'WEB3_REQUEST_USER_DATA' }, '*');
        }
      }
      submitScore(distance, score) {
        const payload = {
          gameId: 'schizo-fuzz',
          gameName: 'Schizo Fuzz',
          distance: Math.floor(distance),
          score: Math.floor(score),
          timestamp: Date.now()
        };
        this.notify(`Score Submitted: ${payload.score} pts`);
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'GAME_SUBMIT_SCORE', payload }, '*');
        }
        window.postMessage({ type: 'GAME_SUBMIT_SCORE', payload }, '*');
      }
      handleIncomingMessage(e) {
        if (!e.data) return;
        if (e.data.type === 'WEB3_RESPONSE_USER_DATA') {
          this.userData = e.data.payload || this.userData;
          this.notify(`Connected: ${this.userData.username || 'Player'}`);
          if (this.onUser) this.onUser(this.userData);
        }
      }
    }
    const bridge = new DokidokiWeb3Bridge();

    // ========================================================
    // 2. PROCEDURAL SOUND SYNTHESIZER
    // ========================================================
    class SoundSynth {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playLaunch() {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(750, now + 0.2);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.25);
      }
      playBounce() {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(60, now + 0.12);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.14);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.14);
      }
      playRamp() {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(850, now + 0.22);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.25);
      }
      playAcorn() {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = f;
          gain.gain.setValueAtTime(0.25, now + i * 0.05);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.05 + 0.22);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + i * 0.05);
          osc.stop(now + i * 0.05 + 0.22);
        });
      }
      playShield() {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.linearRampToValueAtTime(880, now + 0.15);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.2);
      }
      playRustle() {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const bufferSize = this.ctx.sampleRate * 0.1;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 1600;
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start(now);
      }
      playSmash() {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(50, now + 0.18);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.22);
      }
    }

        const sky = this.add.tileSprite(0, 0, 500, 360, 'layer_5_sky').setOrigin(0, 0).setDepth(1);

        this.radarIcons = [
          this.add.image(500 - 102, 28, 'item_2').setScale(0.55).setDepth(26),

        ];

        // Bottom Authentic Kadokado Light Cyan HUD Frame
        const hudBg = this.add.graphics().setDepth(25);
        hudBg.fillStyle(0xe0f2fe, 0.95);
        hudBg.fillRect(0, 360 - 32, 500, 32);
        hudBg.lineStyle(2, 0x38bdf8, 0.9);
        hudBg.lineBetween(0, 360 - 32, 500, 360 - 32);

        // K Badge & Meters
        const kBadge = this.add.graphics().setDepth(26);

        kBadge.fillCircle(52, 360 - 16, 9);
        kBadge.lineStyle(1.5, 0x854d0e, 1);
        kBadge.strokeCircle(52, 360 - 16, 9);
        this.add.text(52, 360 - 16, 'K', {
          fontFamily: 'Outfit, sans-serif',

        }).setOrigin(0.5).setDepth(27);

        const stamBg = this.add.graphics().setDepth(26);

        stamBg.fillRoundedRect(90, 360 - 23, 120, 14, 7);
        stamBg.lineStyle(2, 0x94a3b8, 1);
        stamBg.strokeRoundedRect(90, 360 - 23, 120, 14, 7);

        if (typeof this.refreshStaminaBar === 'function') {
          this.refreshStaminaBar();
        }

        this.distText = this.add.text(24, 360 - 16, '0', {
          fontFamily: 'Outfit, sans-serif',
          fontSize: '18px',
          fontStyle: '900',
          color: '#0284c7'
        }).setOrigin(0.5, 0.5).setDepth(26);

        this.scoreText = this.add.text(500 - 14, 360 - 16, '0000000', {
          fontFamily: 'Outfit, sans-serif',
          fontSize: '22px',
          color: '#0369a1',
          fontStyle: '900',
          stroke: '#ffffff',
          strokeThickness: 4
        }).setOrigin(1, 0.5).setDepth(26);

        // Inputs
        this.cursors = this.input.keyboard.createCursorKeys();
        this.spaceKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);

        this.input.on('pointerdown', (pointer) => {
          sound.init();
          if (this.haxeState === 'Wait') {
            this.handleSpacePress();
          } else if (this.haxeState === 'Start') {
            this.handleSpaceRelease();
          } else if (this.haxeState === 'Angle') {
            this.handleSpacePress();
          } else if (this.haxeState === 'Run') {
            if (pointer.y < 180) this.touchUp = true;
            else this.touchDown = true;
          } else if (this.haxeState === 'GameOver') {
            this.initHaxeGame();
          }
        });

        this.input.on('pointerup', () => {
          this.touchUp = false;
          this.touchDown = false;
        });

        this.initHaxeGame();
      }

      initHaxeGame() {
        this.scroll = 150.0;
        this.pos = { x: 200.0, y: BOTTOM - 10, dx: 0.0, dy: 0.0 };
        this.angle = 0;
        this.speed = 10;
        this.nextObject = 100 + Math.floor(Math.random() * 400);
        this.itemDist = 0;
        this.haxeState = 'Wait';
        this.nextPos = 0;
        this.dispPos = 0;
        this.bonus = false;
        this.gameover = false;
        this.lastHitType = 'none';
        this.totalScore = 0;
        this.currentProbas = [...PROBAS_DEFAULT];
        this.nextItems = [
          this.randomProbas(this.currentProbas),
          this.randomProbas(this.currentProbas),
          this.randomProbas(this.currentProbas)
        ];

        this.activeItems.forEach(i => i.sprite.destroy());
        this.activeItems = [];
        this.bgDecorations.forEach(d => d.destroy());
        this.bgDecorations = [];

        this.heroContainer.setPosition(200, BOTTOM - 10);
        this.heroContainer.setRotation(0);
        this.heroHelmet.setVisible(false);
        this.slingshotPlate.setPosition(140, BOTTOM - 25).setVisible(true);
        this.aimArrow.setVisible(false);
        this.heightArrow.setVisible(false);

        this.updateRadarDisplay();
        this.scoreText.setText('0000000');
        this.distText.setText('0m');

        if (this.gameOverDialog) {
          this.gameOverDialog.destroy();
          this.gameOverDialog = null;
        }
      }

      randomProbas(tbl) {
        let t = 0;
        for (let i = 0; i < tbl.length; i++) t += tbl[i];
        let r = Math.floor(Math.random() * t);
        for (let i = 0; i < tbl.length; i++) {
          r -= tbl[i];
          if (r < 0) return i;
        }
        return 0;
      }

      setAngle(a) {
        const amax = (Math.PI * 7) / 16;
        if (a > amax) a = amax;
        this.angle = a;
        this.pos.dx = Math.cos(a) * this.speed;
        this.pos.dy = -Math.sin(a) * this.speed;
      }

      handleSpacePress() {
        if (this.haxeState === 'Wait') {
          this.haxeState = 'Start';
          this.speed = 10;
        } else if (this.haxeState === 'Angle') {
          this.aimArrow.setVisible(false);
          const s = Math.pow(this.speed - 10, 0.7) + 30;
          this.pos.dx = Math.cos(this.angle) * s;
          this.pos.dy = Math.sin(this.angle) * s;
          this.pos.x += this.pos.dx;
          this.pos.y -= this.pos.dy;
          this.haxeState = 'Run';
          sound.playLaunch();
        }
      }

      handleSpaceRelease() {
        if (this.haxeState === 'Start') {
          this.aimArrow.setPosition(this.pos.x - 100 + this.speed * 2, 250);
          this.aimArrow.setVisible(true);
          this.haxeState = 'Angle';
        }
      }

      update(time, delta) {
        const tmod = Math.min(delta / 16.666, 2.0);
        const count = 5;
        for (let i = 0; i < count; i++) {
          this.doUpdate(tmod / count, i === 0);
        }
      }

      doUpdate(tmod, first) {
        if (Phaser.Input.Keyboard.JustDown(this.spaceKey)) {
          if (this.haxeState === 'Wait' || this.haxeState === 'Angle') {
            this.handleSpacePress();
          } else if (this.haxeState === 'GameOver') {
            this.initHaxeGame();
          }
        }
        if (Phaser.Input.Keyboard.JustUp(this.spaceKey)) {
          if (this.haxeState === 'Start') this.handleSpaceRelease();
        }

        if (this.slingBandGfx) {
          this.slingBandGfx.clear();
          if (this.haxeState === 'Start' || this.haxeState === 'Angle') {
            const postX = this.slingshotPlate.x;
            const postY = this.slingshotPlate.y;
            const foxX = this.heroContainer.x;
            const foxY = this.heroContainer.y;
            this.slingBandGfx.lineStyle(3, 0xd4b483, 1);
            this.slingBandGfx.lineBetween(postX - 12, postY - 15, foxX, foxY);
            this.slingBandGfx.lineBetween(postX + 12, postY - 10, foxX, foxY);
          }
        }

        switch (this.haxeState) {
          case 'Wait':
            this.updateScroll(tmod);
            if (this.spaceKey.isDown || this.touchUp || this.touchDown) {
              this.haxeState = 'WaitSpace';
              this.waitSpaceNextState = 'Start';
              this.speed = 10;
            }
            break;

          case 'WaitSpace':
            this.updateScroll(tmod);
            if (!this.spaceKey.isDown && !this.touchUp && !this.touchDown) {
              this.haxeState = this.waitSpaceNextState || 'Start';
            }
            break;

          case 'Start':
            this.speed += tmod / 2;
            if (this.speed > 30) {
              this.speed = 30;
              this.aimArrow.setPosition(this.pos.x - 100 + this.speed * 2, 250);
              this.aimArrow.setVisible(true);
              this.haxeState = 'WaitSpace';
              this.waitSpaceNextState = 'Angle';
            }
            this.pos.x = 200 - this.speed * 3;
            const ds0 = this.updateScroll(tmod);
            this.updateObjects();
            this.checkObjects(ds0);
            if (this.spaceKey.isDown || this.touchUp || this.touchDown) {
              this.aimArrow.setPosition(this.pos.x - 100 + this.speed * 2, 250);
              this.aimArrow.setVisible(true);
              this.haxeState = 'WaitSpace';
              this.waitSpaceNextState = 'Angle';
            }
            break;

          case 'Angle':
            this.angle += (this.speed * tmod) / 50;
            let a = this.angle % Math.PI;
            if (a > Math.PI / 2) a = Math.PI - a;
            a = ((a / (Math.PI / 2)) * 0.4 + 0.05) * (Math.PI / 2);
            this.aimArrow.setRotation((-a * 180) / Math.PI / 57.2958);
            this.angle = a;
            if (this.spaceKey.isDown || this.touchUp || this.touchDown) {
              this.aimArrow.setVisible(false);
              const s = Math.pow(this.speed - 10, 0.7) + 30;
              this.pos.dx = Math.cos(this.angle) * s;
              this.pos.dy = Math.sin(this.angle) * s;
              this.pos.x += this.pos.dx;
              this.pos.y -= this.pos.dy;
              this.haxeState = 'Run';
              sound.playLaunch();
            }
            break;

          case 'Run':
            this.updatePos(tmod);
            const ds = this.updateScroll(tmod);
            this.itemDist += ds;
            if (!this.gameover) {
              this.totalScore += Math.floor(ds * 1.5);
              this.scoreText.setText(this.totalScore.toString().padStart(7, '0'));
              this.distText.setText(`${Math.floor(this.pos.x)}m`);
            }
            this.updateObjects();
            this.checkObjects(ds);
            this.updateHero(tmod);
            this.updateParticles(ds);
            break;

          case 'WaitFrames':
            this.updateParticles(0);
            if (!first) return;
            if (this.waitFramesCount <= 0) {
              this.heroContainer.setVisible(true);
              this.haxeState = 'Run';
            } else {
              this.waitFramesCount--;
            }
            break;
        }
      }

      showFloatingPopup(x, y, text, color = '#facc15') {
        const popup = this.add.text(x, y, text, {
          fontFamily: 'Outfit, sans-serif',
          fontSize: '15px',
          fontStyle: '900',
          color: color,
          stroke: '#000000',
          strokeThickness: 3,
        }).setOrigin(0.5).setDepth(40);

        this.tweens.add({
          targets: popup,
          y: y - 50,
          alpha: 0,
          scale: 1.25,
          duration: 750,
          ease: 'Cubic.easeOut',
          onComplete: () => popup.destroy(),
        });
      }

      updatePos(tmod) {
        this.pos.x += (this.pos.dx / 2) * tmod;
        this.pos.y -= (this.pos.dy / 2) * tmod;
        this.pos.dy -= 0.1 * tmod;

        if (this.pos.y > BOTTOM) {
          this.pos.y = BOTTOM;
          this.pos.dx *= 0.7;
          this.pos.dy *= -0.65;
          sound.playBounce();

          if (this.speed > 10) {
            this.createParticle(1, this.heroContainer.x, BOTTOM - 2, 2);
            this.haxeState = 'WaitFrames';
            this.waitFramesCount = 4;
          } else if (this.speed < 3) {
            this.pos.dy = 1;
          }
        }

        this.speed = Math.sqrt(this.pos.dx * this.pos.dx + this.pos.dy * this.pos.dy);
        if (this.speed > 20) {
          const p = Math.pow(0.999, tmod);
          this.speed *= p;
          this.pos.dx *= p;
          this.pos.dy *= p;
        }

        this.angle = Math.atan2(-this.pos.dy, this.pos.dx);
        this.vangle = this.angle;

        if (this.pos.y > BOTTOM - 20 && this.speed < 10) {
          this.pos.dx = this.speed * Math.pow(0.95, tmod);
          this.pos.dy = 0;
          this.pos.y = BOTTOM;
        } else if (this.cursors.left.isDown || this.cursors.up.isDown || this.touchUp) {
          const mina = 0.05 + (BOTTOM - this.pos.y) / 10000;
          if (this.angle > mina) {
            this.angle -= (0.03 * Math.sqrt(this.speed)) / 4 * tmod;
            if (this.angle < mina) this.angle = mina;
            this.setAngle(this.angle);
          }
          this.vangle = -Math.PI / 4;
        } else if (this.cursors.right.isDown || this.cursors.down.isDown || this.touchDown) {
          this.pos.dy -= 0.1 * tmod;
          this.vangle = Math.PI / 4;
        }
      }

      updateScroll(tmod) {
        const p = Math.pow(0.825, tmod);
        const old = Math.floor(this.scroll);
        this.scroll = this.scroll * p + (this.pos.x - 50) * (1 - p);

        // Parallax background layer tile positions (matching 5000px panoramas)
        // bgs: [0: ground, 1: nearTrees, 2: midTrees, 3: peachForest, 4: hills, 5: sky]
        if (this.bgs[0]) this.bgs[0].setTilePosition((this.scroll * 1.0 * 10) % 5000, 0);
        if (this.bgs[2]) this.bgs[2].setTilePosition((this.scroll * 0.3 * 10) % 5000, 0);
        if (this.bgs[3]) this.bgs[3].setTilePosition((this.scroll * 0.2 * 10) % 5000, 0);
        if (this.bgs[4]) this.bgs[4].setTilePosition((this.scroll * 0.1 * 10) % 5000, 0);
        if (this.bgs[5]) this.bgs[5].setTilePosition(0, 0);

        if (this.grassFront) {
          this.grassFront.setTilePosition((this.scroll * 1.0 * 10) % 5000, 0);
        }

        return Math.floor(this.scroll) - old;
      }

      updateObjects() {
        while (this.itemDist > 500) {
          this.itemDist -= 500;
          while (this.nextItems.length <= this.nextPos + 3) {
            this.nextItems.push(this.randomProbas(this.currentProbas));
          }

          const id = this.nextItems[this.nextPos++];
          const spr = this.add.image(500 + this.itemDist, BOTTOM, `item_${id}`).setDepth(12);
          this.activeItems.push({ sprite: spr, k: id, active: false });
        }

        // Background near trees (bm_tree_1, bm_tree_2, bm_tree_3)
        if (this.scroll >= this.nextObject) {
          this.nextObject += 140 + Math.floor(Math.random() * 500);
          const treeKeys = ['bm_tree_1', 'bm_tree_2', 'bm_tree_3'];
          const chosenKey = treeKeys[Math.floor(Math.random() * treeKeys.length)];
          const bgObj = this.add.image(540, 300, chosenKey)
            .setOrigin(0.5, 1.0)
            .setDepth(6)
            .setScale(0.85)
            .setAlpha(0.95);
          this.bgDecorations.push(bgObj);
        }

        this.updateRadarDisplay();
      }

      updateRadarDisplay() {
        for (let i = 0; i < 3; i++) {
          const itemK = this.nextItems[this.dispPos + i] ?? 2;
          this.radarIcons[i].setTexture(`item_${itemK}`);
        }
      }

      checkObjects(ds) {
        for (let i = this.bgDecorations.length - 1; i >= 0; i--) {
          const obj = this.bgDecorations[i];
          obj.x -= ds * 0.7;
          if (obj.x < -80) {
            obj.destroy();
            this.bgDecorations.splice(i, 1);
          }
        }

        if (this.slingshotPlate) this.slingshotPlate.x -= ds;

        for (let i = this.activeItems.length - 1; i >= 0; i--) {
          const item = this.activeItems[i];
          item.sprite.x -= ds;

          if (item.k === 0) item.sprite.rotation += 0.05;

          if (item.sprite.x < -40) {
            item.sprite.destroy();
            this.activeItems.splice(i, 1);
            this.dispPos++;
            this.currentProbas[3]++;
          } else if (!item.active && !this.gameover) {
            const hx = Math.floor(this.pos.x - this.scroll);
            const hy = this.pos.y;
            const dist = Phaser.Math.Distance.Between(hx, hy, item.sprite.x, item.sprite.y);

            if (dist < 42) {
              item.active = true;
              if (this.bonus && (item.k === 3 || item.k === 4)) {
                this.bonus = false;
                this.heroHelmet.setVisible(false);
                sound.playSmash();
                this.createParticle(6, item.sprite.x, item.sprite.y, ds);
              } else {
                this.totalScore += POINTS_TABLE[item.k] || 0;
                switch (item.k) {
                  case 0:
                    this.lastHitType = 'wheel';
                    this.cameras.main.shake(180, 0.02);
                    this.showFloatingPopup(this.heroContainer.x, this.heroContainer.y - 20, 'WATERWHEEL SPIN!', '#38bdf8');
                    if (Math.abs(this.angle) < 0.3) this.setAngle(-0.3);
                    this.pos.dx += 20;
                    if (this.pos.dx > 30) this.pos.dx = 30;
                    this.heroContainer.setVisible(true);
                    this.haxeState = 'WaitFrames';
                    this.waitFramesCount = 21;
                    sound.playSmash();
                    break;
                  case 1:
                    this.lastHitType = 'bush';
                    this.showFloatingPopup(this.heroContainer.x, this.heroContainer.y - 20, 'BUSH RUSTLE!', '#22c55e');
                    this.angle += Math.PI / 5;
                    this.setAngle(this.angle);
                    for (let n = 0; n < 10; n++) this.createParticle(5, item.sprite.x, item.sprite.y, ds);
                    if (this.pos.dy <= 4) this.pos.dy = 4;
                    sound.playRustle();
                    break;
                  case 2:
                    this.cameras.main.shake(120, 0.012);
                    this.showFloatingPopup(this.heroContainer.x, this.heroContainer.y - 20, 'SUPER RAMP!', '#facc15');
                    this.pos.dy = Math.abs(this.pos.dy) + 10;
                    if (this.pos.dy > 30) this.pos.dy = 30;
                    sound.playRamp();
                    break;
                  case 3:
                    this.lastHitType = 'stump';
                    this.cameras.main.shake(300, 0.035);
                    this.showFloatingPopup(this.heroContainer.x, this.heroContainer.y - 20, 'CRASH!', '#ef4444');
                    this.speed = 0;
                    this.pos.dx = 0.01;
                    this.pos.dy = 0;
                    sound.playSmash();
                    this.triggerGameOver();
                    break;
                  case 4:
                    this.bonus = true;
                    this.heroHelmet.setVisible(true);
                    this.cameras.main.shake(150, 0.015);
                    this.showFloatingPopup(this.heroContainer.x, this.heroContainer.y - 20, 'HELMET SHIELD!', '#c084fc');
                    this.pos.dx += 10;
                    sound.playShield();
                    break;
                  case 5:
                    this.pos.dx += 15;
                    this.totalScore += 20000;
                    this.cameras.main.shake(150, 0.015);
                    this.showFloatingPopup(this.heroContainer.x, this.heroContainer.y - 20, '+20,000 GOLDEN ACORN!', '#facc15');
                    sound.playAcorn();
                    item.sprite.destroy();
                    break;
                }
              }
            }
          }
        }
      }

      updateHero(tmod) {
        this.heroContainer.x = Math.floor(this.pos.x - this.scroll);
        this.heroContainer.y = this.pos.y;

        if (this.haxeState === 'Wait') {
          this.heroSprite.setTexture('shizzo_starting').setScale(0.42);
        } else if (this.haxeState === 'Start' || this.haxeState === 'Angle') {
          this.heroSprite.setTexture('shizzo_prep').setScale(0.42);
        } else if (this.haxeState === 'Run') {
          if (this.pos.y >= BOTTOM - 4) {
            this.heroSprite.setTexture('shizzo_boink').setScale(0.42);
          } else if (this.bonus) {
            if (this.cursors.right.isDown || this.cursors.down.isDown || this.touchDown) {
              this.heroSprite.setTexture('shizzo_fly_helmet_down').setScale(0.42);
            } else {
              this.heroSprite.setTexture('shizzo_fly_superman').setScale(0.42);
            }
          } else {
            if (this.cursors.left.isDown || this.cursors.up.isDown || this.touchUp) {
              this.heroSprite.setTexture('shizzo_fly_flap').setScale(0.42);
            } else {
              this.heroSprite.setTexture('shizzo_fly_straight').setScale(0.42);
            }
          }
        } else if (this.haxeState === 'WaitFrames') {
          if (this.lastHitType === 'wheel') {
            this.heroSprite.setTexture('shizzo_spin_wheel').setScale(0.42);
          } else if (this.lastHitType === 'bush') {
            this.heroSprite.setTexture('shizzo_intense').setScale(0.42);
          } else {
            this.heroSprite.setTexture('shizzo_hit_turbulence').setScale(0.42);
          }
        } else if (this.haxeState === 'GameOver') {
          if (this.lastHitType === 'stump') {
            this.heroSprite.setTexture(this.bonus ? 'shizzo_helmet_ground' : 'shizzo_hit_stump').setScale(0.42);
          } else {
            this.heroSprite.setTexture('shizzo_hit_squished').setScale(0.42);
          }
        }

        if (this.heroContainer.y < -30) {
          this.heightArrow.setVisible(true);
          this.heightArrow.x = Math.max(30, Math.min(470, this.heroContainer.x));
          const meters = Math.floor(-this.heroContainer.y / 10);
          this.heightText.setText(`${meters}m`);
          const scale = Math.max(0.6, (100 - Math.sqrt(-this.heroContainer.y)) / 100);
          this.heightArrow.setScale(scale);
        } else {
          this.heightArrow.setVisible(false);
        }

        const ca = this.heroContainer.rotation;
        const newRot = ca + Math.sin(this.vangle - ca) * Math.max(this.speed / 30, 0.03) * tmod;
        this.heroContainer.setRotation(newRot);
        this.heroTail.setRotation(-newRot + this.angle);

        if (this.speed < 1 && this.pos.y > BOTTOM - 20 && this.pos.dy <= 0 && !this.gameover) {
          this.triggerGameOver();
        }
      }

      createParticle(id, x, y, ds) {
        let tex = 'p_smoke';
        let dx = (Math.random() - 0.5) * ds * 2;
        let dy = -Math.random() * 2;
        if (id === 5) {
          tex = 'p_leaf';
          dy = -Math.random() * 1.5;
        } else if (id >= 6) {
          tex = 'p_dirt';
          dy = -Math.random() * 2.5;
        }
        const spr = this.add.image(x, y, tex).setDepth(14);
        spr.setScale(0.8 + Math.random() * 0.6);
        this.particlesList.push({ sprite: spr, dx, dy, id, life: 30 });
      }

      updateParticles(ds) {
        for (let i = this.particlesList.length - 1; i >= 0; i--) {
          const p = this.particlesList[i];
          p.sprite.x -= ds * 0.8;
          p.sprite.x += p.dx;
          p.sprite.y += p.dy;
          p.dy += 0.08;
          p.life--;
          p.sprite.alpha = p.life / 30;
          if (p.life <= 0 || p.sprite.y > BOTTOM + 30) {
            p.sprite.destroy();
            this.particlesList.splice(i, 1);
          }
        }
      refreshStaminaBar() {
        if (!this.staminaBar) return;
        this.staminaBar.clear();
        this.staminaBar.fillStyle(0xf43f5e, 1);
        const w = (this.staminaVal / 100) * 116;
        if (w > 0) {
          this.staminaBar.fillRoundedRect(92, 360 - 21, w, 10, 5);
        }
      }

      triggerGameOver() {
        this.gameover = true;
        this.haxeState = 'GameOver';

        bridge.submitScore(this.pos.x, this.totalScore);

        this.gameOverDialog = this.add.container(250, 170).setDepth(100);

        const card = this.add.graphics();
        card.fillStyle(0xf0fdfa, 0.98);
        card.fillRoundedRect(-140, -90, 280, 180, 12);
        card.lineStyle(3, 0x14b8a6);
        card.strokeRoundedRect(-140, -90, 280, 180, 12);

        const h = this.add.text(0, -65, 'VOTRE SCORE', {
          fontFamily: 'Outfit',
          fontSize: '18px',
          fontStyle: '900',
          color: '#0d9488'
        }).setOrigin(0.5);

        const sc = this.add.text(0, -30, this.totalScore.toLocaleString(), {
          fontFamily: 'Outfit',
          fontSize: '34px',
          fontStyle: '900',
          color: '#ea580c'
        }).setOrigin(0.5);

        const d = this.add.text(0, 10, `Distance: ${Math.floor(this.pos.x)}m`, {
          fontFamily: 'JetBrains Mono',
          fontSize: '12px',
          color: '#0f766e',
          fontStyle: 'bold'
        }).setOrigin(0.5);

        const b = this.add.graphics();
        b.fillStyle(0x0d9488, 1);
        b.fillRoundedRect(-100, 35, 200, 36, 6);

        const bt = this.add.text(0, 53, 'REJOUER (TAP / SPACE)', {
          fontFamily: 'Outfit',
          fontSize: '12px',
          fontStyle: '800',
          color: '#ffffff'
        }).setOrigin(0.5);

        this.gameOverDialog.add([card, h, sc, d, b, bt]);
      }
    }

    const config = {
      type: Phaser.AUTO,
      parent: 'phaser-container',
      width: 500,
      height: 360,
      scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH
      },
      scene: [StandaloneHaxeScene]
    };

    const gGame = new Phaser.Game(config);
  </script>
</body>
</html>
